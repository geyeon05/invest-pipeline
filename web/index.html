<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기업분석 진행판</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

<header class="top">
  <h1>기업분석 진행판</h1>
  <div class="pick">
    <div class="search">
      <label for="co" class="sr">회사 검색</label>
      <input id="co" type="search" autocomplete="off" placeholder="회사 이름 · 티커 · 별칭 (예: 삼성, AAPL, 애플)"
        role="combobox" aria-expanded="false" aria-controls="colist" aria-autocomplete="list">
      <ul id="colist" class="colist" role="listbox" hidden></ul>
    </div>
    <div class="filters" role="group" aria-label="목록 거르기">
      <button type="button" class="fchip on" data-f="all">전체</button>
      <button type="button" class="fchip" data-f="book">분석 중</button>
      <button type="button" class="fchip" data-f="hold">보유 중</button>
    </div>
    <button id="start" class="btn-start" type="button">분석 시작</button>
  </div>
</header>

<nav class="tabs" aria-label="방 선택">
  <button type="button" data-tab="basic" class="tab on">기본 분석</button>
  <button type="button" data-tab="case" class="tab">과제</button>
</nav>

<div id="msg" class="msg" role="status" hidden></div>

<main id="basic">
  <section id="progress" class="card" hidden></section>

  <div class="row">
    <aside id="profile" class="card profile"></aside>
    <section id="price" class="card price" aria-label="주가"></section>
  </div>

  <div id="empty" class="card empty">회사를 고르고 '분석 시작'을 누르세요.</div>
  <section id="info" class="card lane-info" hidden></section>
  <section id="discuss" class="card lane-discuss" hidden></section>
  <section id="final" class="card lane-final" hidden></section>
  <section id="hold" class="card lane-info" hidden></section>
  <details id="roles" class="card" hidden><summary>역할 기록 (자동)</summary><div></div></details>
</main>

<main id="case" hidden></main>

</div>
<script src="app.js"></script>
<script src="case.js"></script>
</body>
</html>
